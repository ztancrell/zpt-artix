# Locked memory for the games group, from the Artix gaming ISO (iso-profiles 0-gaming.conf).
# Its nofile 524288 is left out: pam_limits lets a group entry beat a * entry, so it would lower the
# hard nofile 1048576 that zpt-artix-settings' 30-nofile.conf sets.
@games	soft	memlock	unlimited
@games	hard	memlock	unlimited
